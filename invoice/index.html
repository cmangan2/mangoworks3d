<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>MangoWorks3D Quote</title>
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --mango: #FF8C00; --ink: #1A1A1A; --muted: #6B6B6B; --line: #E6E3DC; --paper: #FFFFFF; --bg: #0D0D0D; --teal: #00A88B; }
  body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; padding: 1.5rem 1rem 3rem; }
  .wrap { max-width: 820px; margin: 0 auto; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .topbar a { color: #A0A0A0; text-decoration: none; font-weight: 700; font-size: 0.9rem; }
  .topbar a:hover { color: var(--mango); }
  .paper { background: var(--paper); border-radius: 14px; padding: 2.5rem; position: relative; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .paper::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: var(--mango); }
  .head { display: flex; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap; align-items: flex-start; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 64px; height: 64px; }
  .brand .name { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 2px; line-height: 1; color: var(--mango); }
  .brand .name span { color: var(--ink); }
  .brand .sub { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
  .doc { text-align: right; }
  .doc h1 { font-family: 'Bebas Neue', sans-serif; font-size: 2.6rem; letter-spacing: 3px; line-height: 1; }
  .meta { display: grid; grid-template-columns: auto auto; gap: 2px 14px; font-size: 0.88rem; margin-top: 0.6rem; justify-content: end; }
  .meta dt { color: var(--muted); text-align: right; }
  .meta dd { font-weight: 800; text-align: right; }
  .parties { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin: 2rem 0 1.5rem; }
  .label { font-size: 0.7rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: var(--mango); margin-bottom: 0.4rem; }
  .party { font-size: 0.92rem; line-height: 1.55; }
  .party strong { font-size: 1rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  thead th { text-align: left; font-size: 0.7rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); padding: 0.6rem 0.5rem; border-bottom: 2px solid var(--ink); }
  tbody td { padding: 0.8rem 0.5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  .num { text-align: right; white-space: nowrap; }
  .desc-sub { color: var(--muted); font-size: 0.82rem; margin-top: 2px; }
  .totals { margin-left: auto; width: min(320px, 100%); margin-top: 1rem; font-size: 0.95rem; }
  .totals div { display: flex; justify-content: space-between; padding: 0.35rem 0.5rem; }
  .totals .grand { border-top: 2px solid var(--ink); margin-top: 0.35rem; padding-top: 0.6rem; font-weight: 900; font-size: 1.25rem; }
  .totals .grand span:last-child { color: var(--mango); }
  .note { margin-top: 1.75rem; background: #FFF6EA; border-left: 4px solid var(--mango); border-radius: 8px; padding: 1rem 1.25rem; font-size: 0.92rem; line-height: 1.6; white-space: pre-wrap; }
  /* PAID stamp sits beside the totals, clear of the header text. */
  .totals-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .totals-row .totals { margin-left: auto; }
  .stamp {
    margin-left: 1.5rem; transform: rotate(-12deg); flex-shrink: 0;
    border: 4px solid var(--teal); color: var(--teal); border-radius: 10px; padding: 0.3rem 1rem;
    font-family: 'Bebas Neue', sans-serif; font-size: 2.6rem; letter-spacing: 4px; opacity: 0.85; pointer-events: none;
  }
  .paidline { margin-top: 1.25rem; color: var(--teal); font-weight: 800; font-size: 0.95rem; }
  .pending { margin-top: 1.5rem; color: var(--muted); font-size: 0.95rem; line-height: 1.6; }
  .foot { margin-top: 2.25rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.82rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .actions { margin-top: 1.25rem; display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
  .btn { background: var(--mango); color: #000; border: none; border-radius: 50px; padding: 0.9rem 1.75rem; font-weight: 900; font-size: 1rem; cursor: pointer; font-family: inherit; }
  .btn:disabled { opacity: 0.6; }
  .btn-ghost { background: transparent; color: #F5F5F0; border: 1px solid rgba(255,255,255,0.25); border-radius: 50px; padding: 0.8rem 1.4rem; font-weight: 800; font-size: 0.92rem; cursor: pointer; font-family: inherit; text-decoration: none; }
  .btn-ghost:hover { border-color: var(--mango); }
  .secure { color: #A0A0A0; font-size: 0.8rem; width: 100%; }
  .banner { background: rgba(0,201,167,0.12); border: 1px solid rgba(0,201,167,0.4); color: #00C9A7; font-weight: 800; border-radius: 12px; padding: 0.9rem 1.2rem; margin-bottom: 1rem; display: none; }
  .error { color: #FF6B6B; font-weight: 700; text-align: center; padding: 3rem 1rem; }
  @media (max-width: 600px) {
    .paper { padding: 1.5rem 1.1rem; }
    .brand { min-width: 0; }
    .brand img { width: 44px; height: 44px; }
    .brand .name { font-size: 1.45rem; letter-spacing: 1px; }
    .brand .sub { font-size: 0.75rem; overflow-wrap: anywhere; }
    .doc h1 { font-size: 2.1rem; }
    .doc { text-align: left; }
    .meta { justify-content: start; }
    .meta dt, .meta dd { text-align: left; }
    .parties { grid-template-columns: 1fr; }
    .totals-row { flex-direction: column-reverse; align-items: stretch; }
    .stamp { align-self: center; margin: 1rem 0 0; font-size: 2rem; }
    .hide-sm { display: none; }
  }
  @media print {
    body { background: #fff; padding: 0; }
    .topbar, .actions, .banner { display: none !important; }
    .paper { box-shadow: none; border-radius: 0; padding: 0.5in 0.4in; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="/">← mangoworks3d.com</a>
    <a href="/account">My Orders</a>
  </div>
  <div class="banner" id="banner"></div>
  <div id="doc"><p class="error" style="color:#A0A0A0;">Loading…</p></div>
  <div class="actions" id="actions"></div>
</div>

<script>
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = (c) => (c / 100).toLocaleString('en-US', { style: 'currency', currency: 'USD' });
  const fmtDate = (iso) => new Date(iso).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || '', token = params.get('t') || '';
  let INV = null;

  async function call(path, body) {
    const res = await fetch('/api/invoice/' + encodeURIComponent(id) + path + (body ? '' : '?t=' + encodeURIComponent(token)), {
      method: body ? 'POST' : 'GET', credentials: 'same-origin',
      headers: body ? { 'content-type': 'application/json' } : {},
      body: body ? JSON.stringify({ t: token, ...body }) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');
    return data;
  }

  function addressHtml(a) {
    if (!a) return '<span style="color:var(--muted)">—</span>';
    return [a.line1, a.line2, `${a.city}, ${a.state} ${a.zip}`, a.country && a.country !== 'United States' ? a.country : '']
      .filter(Boolean).map(esc).join('<br/>');
  }

  function render(inv) {
    INV = inv;
    const q = inv.quote;
    document.title = `${inv.paid ? 'Invoice' : 'Quote'} ${inv.id} — MangoWorks3D`;
    const rows = q ? q.lines.map(l => `<tr>
        <td>${esc(l.desc)}</td>
        <td class="num">${l.qty}</td>
        <td class="num hide-sm">${money(l.unit)}</td>
        <td class="num">${money(l.qty * l.unit)}</td></tr>`).join('')
      : inv.items.map(i => `<tr><td>${esc(i.name)}<div class="desc-sub">${esc(i.material)} · ${esc(i.color)}</div></td>
        <td class="num">${i.qty}</td><td class="num hide-sm">—</td><td class="num">—</td></tr>`).join('');
    document.getElementById('doc').innerHTML = `
      <div class="paper">
        <div class="head">
          <div class="brand">
            <img src="/images/logo.png" alt=""/>
            <div><div class="name">MANGO<span>WORKS</span>3D</div>
              <div class="sub">Custom 3D printing<br/>${esc(inv.business.email)} · mangoworks3d.com</div></div>
          </div>
          <div class="doc">
            <h1>${inv.paid ? 'INVOICE' : 'QUOTE'}</h1>
            <dl class="meta">
              <dt>Number</dt><dd>${esc(inv.id)}</dd>
              <dt>Date</dt><dd>${fmtDate(inv.quotedAt || inv.created)}</dd>
              <dt>Status</dt><dd>${inv.paid ? 'Paid' : esc(inv.statusLabel)}</dd>
            </dl>
          </div>
        </div>
        <div class="parties">
          <div><div class="label">Bill to</div>
            <div class="party"><strong>${esc(inv.name)}</strong><br/>${esc(inv.email)}${inv.phone ? '<br/>' + esc(inv.phone) : ''}</div></div>
          <div><div class="label">Ship to</div><div class="party">${inv.shipTo ? '<strong>' + esc(inv.name) + '</strong><br/>' : ''}${addressHtml(inv.shipTo)}</div></div>
        </div>
        ${rows ? `<table>
          <thead><tr><th>Description</th><th class="num">Qty</th><th class="num hide-sm">Unit price</th><th class="num">Amount</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>` : ''}
        ${q ? `<div class="totals-row">
          ${inv.paid ? '<div class="stamp">PAID</div>' : ''}
          <div class="totals">
            <div><span>Subtotal</span><span>${money(q.subtotal)}</span></div>
            <div><span>Shipping</span><span>${q.shipping ? money(q.shipping) : 'Free'}</span></div>
            <div class="grand"><span>Total</span><span>${money(q.total)}</span></div>
          </div>
        </div>` : `<p class="pending">We're preparing your quote — you'll get an email as soon as it's ready.</p>`}
        ${inv.customerMessage ? `<div class="note">${esc(inv.customerMessage)}</div>` : ''}
        ${inv.shipment ? `<p class="paidline" style="color:var(--ink);">📦 Shipped via ${esc(inv.shipment.carrier)}${inv.shipment.tracking ? ' · ' + esc(inv.shipment.tracking) : ''}${inv.shipment.url ? ` · <a href="${esc(inv.shipment.url)}" target="_blank" rel="noopener" style="color:var(--mango);">Track package →</a>` : ''}</p>` : ''}
        ${inv.paid ? `<p class="paidline">✓ Paid ${money(inv.paid.amount)}${inv.paid.method === 'card' ? ' by card' : ' (' + esc(inv.paid.method) + ')'} on ${fmtDate(inv.paid.at)}. Thank you!</p>` : ''}
        <div class="foot">
          <span>Thank you for supporting MangoWorks3D!</span>
          <span>Questions? ${esc(inv.business.email)}</span>
        </div>
      </div>`;

    const a = [];
    if (inv.payable) {
      a.push(`<button class="btn" id="pay-btn" onclick="pay()">${inv.status === 'quoted' ? 'Approve &amp; pay' : 'Pay'} ${money(q.total)} →</button>`);
    }
    // Only offered while online payment is switched off.
    if (inv.canApprove) a.push(`<button class="btn" onclick="approve(this)">Approve quote →</button>`);
    a.push(`<button class="btn-ghost" onclick="window.print()">Print / Save PDF</button>`);
    if (inv.payable) a.push(`<div class="secure">Secure card payment by Stripe · Apple Pay &amp; Google Pay accepted</div>`);
    document.getElementById('actions').innerHTML = a.join('');
  }

  async function pay() {
    const btn = document.getElementById('pay-btn');
    btn.disabled = true; btn.textContent = 'Opening secure checkout…';
    try { location.href = (await call('/checkout', {})).url; }
    catch (e) { alert(e.message); render(INV); }
  }

  async function approve(btn) {
    if (!confirm('Approve this quote so we can start printing? We\'ll contact you about payment.')) return;
    btn.disabled = true;
    try { render(await call('/approve', {})); showBanner('Thanks! Quote approved — we\'ll be in touch about payment.'); }
    catch (e) { alert(e.message); btn.disabled = false; }
  }

  function showBanner(text) { const b = document.getElementById('banner'); b.textContent = text; b.style.display = 'block'; }

  (async () => {
    try {
      if (params.get('paid') && params.get('session')) {
        const inv = await call('/confirm', { session: params.get('session') });
        history.replaceState(null, '', `?id=${encodeURIComponent(id)}&t=${encodeURIComponent(token)}`);
        render(inv);
        showBanner(inv.paid ? '✅ Payment received — thank you! A receipt is on its way to your email.' : 'Thanks! Your payment is processing — this page will show it as paid shortly.');
      } else {
        render(await call(''));
      }
    } catch (e) {
      document.getElementById('doc').innerHTML = `<p class="error">${esc(e.message)}<br/><br/><a href="/account" style="color:#FF8C00;">Sign in to see your orders →</a></p>`;
    }
  })();
</script>
</body>
</html>
